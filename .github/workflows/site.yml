name: Site page
# The bootstraps page (site/index.md, published at bensonlabs.org/bootstraps/) and its tools: the
# tests and a pack as a release would build it, and a lint of the page's two workflows.
on:
  pull_request:
    paths:
      - 'site/**'
      - 'tools/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test the tools
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Pack the page (as a release would)
        run: python3 tools/pack.py --version v0.0.0

  workflows:
    name: Lint the page's workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A pinned actionlint release, checked against its published sha256 before it runs.
      - name: actionlint
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color .github/workflows/release.yml .github/workflows/site.yml
